[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "daily-report"
version = "1.0.0"
description = "智能日报生成器（SDD 复现）：GitHub 单数据源生成三段式日报，并渲染可发布的静态日报站"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "PyYAML>=6.0",
    "jinja2>=3.1",
    "tzdata>=2024.1; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools]
packages = ["collector", "generator", "notifier", "shared"]

[tool.setuptools.package-data]
generator = ["templates/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

# 排练用配置：采集书作者的公开仓库，输出到 demo/ 目录，不碰你自己的 docs/ 与 data/
# 用途：在没有 Issue/评论可操作时，用真实公开数据演示"某类动作会进哪个板块"

team:
  name: 书作者仓库演示
  leader_email: leader@example.com
  timezone: Asia/Shanghai

repos:
  - owner: huangjia2019
    name: sdd-in-action

members:
  - name: 咖哥
    github_username: huangjia2019
    github_emails: []

sources:
  github:
    token: ${GITHUB_TOKEN}
    include_others: true
    exclude_bots: true
    keywords: []
    sensitive_keywords: [薪资, 绩效, 裁员, 期权, 人事, 调薪]
    max_commit_details: 20
    max_issue_timelines: 20
    per_page: 100
    retry_times: 3
    retry_interval_seconds: 5
    rate_limit_max_wait_seconds: 300
    timeout_seconds: 20

report:
  output_dir: demo/output
  site_dir: demo/docs
  site_title: 智能日报（排练）
  storage_path: demo/data/reports.sqlite3
  log_path: demo/logs/demo.jsonl
  skip_weekends: true
  holidays: []

hours:
  enabled: true
  gap_minutes: 60
  wrap_up_hours: 0.5
  rounding_hours: 0.5
  daily_cap_hours: 12

notify:
  email:
    enabled: false
  lark_bot:
    enabled: false

# 本地运行配置（已在 .gitignore 中，不会进入版本库）

team:
  name: 红豆的研发团队
  leader_email: leader@example.com
  timezone: Asia/Shanghai

repos:
  - owner: wsh-dotcommer
    name: zuoye

members:
  - name: 红豆
    github_username: wsh-dotcommer
    github_emails:
      - 3011859592@qq.com
      - 17592016+king-sh@user.noreply.gitee.com   # 早期用 Gitee 身份提交的邮箱，并入同一成员

sources:
  github:
    token: ${GITHUB_TOKEN}
    include_others: true
    exclude_bots: true
    keywords: []                     # 空列表 = 不做关键词过滤，所有人工评论都进"协作沟通"
    sensitive_keywords: [薪资, 绩效, 裁员, 期权, 人事, 调薪]
    max_commit_details: 100
    max_issue_timelines: 50
    per_page: 100
    retry_times: 3
    retry_interval_seconds: 5
    rate_limit_max_wait_seconds: 300
    timeout_seconds: 20

report:
  output_dir: output
  site_dir: docs
  site_title: 智能日报
  workbench: true                  # true → 站点页内联「日报工作台」（表单/复制/本地草稿）；false → 退回纯只读站
  storage_path: data/reports.sqlite3
  log_path: logs/daily-report.jsonl
  skip_weekends: true
  holidays: []

hours:
  enabled: true
  gap_minutes: 60
  wrap_up_hours: 0.5
  rounding_hours: 0.5
  daily_cap_hours: 12

notify:
  email:
    enabled: true                     # 邮件推送已启用；凭据从 .env 读取
    host: smtp.qq.com                 # QQ 邮箱 SMTP（163 用 smtp.163.com；企业邮箱问 IT）
    port: 465
    use_ssl: true                     # 465 端口配 SSL；若用 587 则改成 false
    sender: 3011859592@qq.com         # 发件人（必须与 .env 里的 SMTP_USERNAME 一致）
    username: ${SMTP_USERNAME}        # 填在 .env：完整邮箱地址
    password: ${SMTP_PASSWORD}        # 填在 .env：QQ 邮箱的「授权码」，不是登录密码
    recipients:
      - 3011859592@qq.com             # 先填自己，方便验证；确认无误后改成 Leader 的邮箱
  lark_bot:
    enabled: true                     # true → 不加 --dry-run 就会把日报推到飞书群
    webhook: ${LARK_BOT_WEBHOOK}      # 填在 .env：飞书群机器人 Webhook 地址
    secret: ${LARK_BOT_SECRET}        # 机器人安全设置选「签名校验」时从 .env 读取
